<style>
:root {
  --ground:#F4F5F3; --surface:#FFFFFF; --soft:#E4EDEC;
  --ink:#14181B; --muted:#58646A; --faint:#859094;
  --accent:#0D5C63; --accent-hover:#0A474D; --on-accent:#FFFFFF;
  --amber:#8A5E14; --neg:#B3261E; --pos:#1B7A48;
  --line:#DBDFDB; --line-strong:#B6BDB9;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D1113; --surface:#141A1C; --soft:#12282A;
    --ink:#E6EAE8; --muted:#9AA6A9; --faint:#6E7A7D;
    --accent:#5FB3B8; --accent-hover:#7FC6CA; --on-accent:#0D1113;
    --amber:#C99A3E; --neg:#F08A80; --pos:#5CC98D;
    --line:#232B2E; --line-strong:#37444A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1113; --surface:#141A1C; --soft:#12282A;
  --ink:#E6EAE8; --muted:#9AA6A9; --faint:#6E7A7D;
  --accent:#5FB3B8; --accent-hover:#7FC6CA; --on-accent:#0D1113;
  --amber:#C99A3E; --neg:#F08A80; --pos:#5CC98D;
  --line:#232B2E; --line-strong:#37444A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(1.25rem,4vw,2.5rem)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:1rem;top:1rem;z-index:10;background:var(--surface);padding:.5rem .8rem}

/* ------------------------------------------------------------ labels */
.mono,.label,.eyebrow,.tag,.crumbs,dt,.k{font-family:var(--mono);font-size:.72rem;
  letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.eyebrow{color:var(--accent);margin:0 0 1.4rem}
.label{color:var(--faint);margin:0}

/* --------------------------------------------------------------- nav */
.nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:1.5rem;min-height:64px}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;
  text-decoration:none;display:flex;align-items:baseline;gap:.55rem;margin-right:auto}
.brand small{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;color:var(--faint);font-weight:500}
.nav nav{display:flex;gap:1.4rem}
.nav nav a{font-family:var(--display);font-weight:500;font-size:.95rem;text-decoration:none;color:var(--muted)}
.nav nav a:hover,.nav nav a[aria-current="page"]{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--display);font-weight:700;
  font-size:.95rem;text-decoration:none;padding:.72rem 1.1rem;border-radius:3px;
  background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);transition:background .15s}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--ink);background:transparent}
.btn .arr{transition:transform .15s}
.btn:hover .arr{transform:translateX(3px)}
.nav .btn{padding:.5rem .9rem;font-size:.88rem}
@media (max-width:720px){.nav nav{display:none}}

/* -------------------------------------------------------------- hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(2rem,5vw,4.5rem);
  align-items:end;padding:clamp(3rem,8vw,6rem) 0 clamp(2.5rem,5vw,3.5rem)}
h1{font-family:var(--display);font-weight:700;letter-spacing:-.035em;line-height:.96;
  margin:0;text-wrap:balance}
.hero h1{font-size:clamp(2.7rem,7vw,5.4rem)}
.hero h1 span{display:block}
.hero h1 .second{color:var(--accent)}
.lede{font-size:clamp(1.08rem,1.6vw,1.22rem);color:var(--muted);max-width:46ch;margin:1.6rem 0 0}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}
.portrait{margin:0}
.portrait .frame{background:#0D5C63;aspect-ratio:4/5;overflow:hidden;border-radius:2px}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;
  filter:grayscale(1) contrast(1.08) brightness(1.04);mix-blend-mode:luminosity}
.portrait figcaption{margin-top:.7rem;color:var(--faint)}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;align-items:start}
  .portrait{max-width:260px;order:-1}
}

/* ------------------------------------------------------------ ledger */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin:0}
.ledger>div{background:var(--surface);padding:1.3rem 1.35rem 1.2rem;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.ledger dt{color:var(--faint)}
.ledger dd{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.4vw,2.3rem);
  line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ledger dd .u{font-size:.45em;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:.28em}
.ledger .n{font-family:var(--mono);font-size:.74rem;color:var(--faint);font-variant-numeric:tabular-nums}
.ledger .spend dd{color:var(--amber)}
.ledger .earn dd{color:var(--accent)}
.ledger .zero dd{color:var(--ink)}
.ledger-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  flex-wrap:wrap;margin:0 0 .8rem}
.ledger-head a{font-family:var(--mono);font-size:.74rem;color:var(--accent);text-decoration:none}
.ledger-head a:hover{text-decoration:underline}

/* ------------------------------------------------------- split spine */
.section{padding:clamp(3rem,7vw,5rem) 0;border-top:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.3fr);gap:1.2rem clamp(2rem,5vw,4.5rem)}
.split>.label{padding-top:.35rem}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.prose p{margin:0 0 1rem;max-width:62ch}
.prose p:last-child{margin-bottom:0}
.prose ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.75rem;max-width:62ch}
.prose li{position:relative;padding-left:1.4rem}
.prose li::before{content:"";position:absolute;left:0;top:.72em;width:.5rem;height:2px;background:var(--accent)}

/* ------------------------------------------------------------ ydelser */
.services{display:flex;flex-direction:column}
.service{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:.4rem 2rem;
  padding:1.35rem 0;border-bottom:1px solid var(--line)}
.service:first-child{padding-top:0}
.service:last-child{border-bottom:0;padding-bottom:0}
.service h3{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1.25}
.service p{margin:0;color:var(--muted)}
@media (max-width:620px){.service{grid-template-columns:1fr}}

/* -------------------------------------------------------------- cases */
.cases{display:flex;flex-direction:column;border-top:1px solid var(--line-strong)}
.case-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) auto 1.5rem;gap:.3rem 1.8rem;
  align-items:center;padding:1.5rem 0;border-bottom:1px solid var(--line);text-decoration:none}
.case-row .tag{color:var(--faint)}
.case-row h3{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3vw,2.1rem);
  letter-spacing:-.025em;line-height:1.05;margin:0;transition:color .15s}
.case-row p{margin:.35rem 0 0;color:var(--muted);font-size:.97rem}
.case-row .mini{font-family:var(--mono);font-size:.76rem;color:var(--faint);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.case-row .mini b{font-weight:500;color:var(--amber)}
.case-row .arr{font-family:var(--display);font-size:1.3rem;color:var(--faint);transition:transform .15s,color .15s}
.case-row:hover h3,.case-row:hover .arr{color:var(--accent)}
.case-row:hover .arr{transform:translateX(4px)}
@media (max-width:720px){
  .case-row{grid-template-columns:minmax(0,1fr) 1.5rem}
  .case-row .tag{grid-column:1/-1}
  .case-row .mini{grid-column:1;text-align:left;white-space:normal}
  .case-row .arr{grid-column:2;grid-row:2}
}

/* ----------------------------------------------------------- timeline */
.timeline{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-strong)}
.timeline li{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:.2rem 1.8rem;
  padding:1rem 0;border-bottom:1px solid var(--line)}
.timeline .when{font-family:var(--mono);font-size:.8rem;color:var(--faint);padding-top:.15rem;font-variant-numeric:tabular-nums}
.timeline .role{font-family:var(--display);font-weight:500;font-size:1.08rem;line-height:1.35}
.timeline .org{color:var(--muted)}
@media (max-width:520px){.timeline li{grid-template-columns:1fr}}

/* -------------------------------------------------------- anbefalinger */
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem}
.quotes blockquote{margin:0}
.quotes p{font-size:1.08rem;margin:0 0 1rem}
.quotes cite{font-style:normal;font-family:var(--display);font-weight:700}
.quotes cite span{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:.9rem}

/* ---------------------------------------------------------- case-side */
.crumbs{color:var(--faint);padding-top:2rem;display:flex;gap:.6rem;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.case-hero{padding:clamp(2rem,6vw,4rem) 0 clamp(2rem,4vw,3rem)}
.case-hero .tag{display:inline-block;color:var(--accent);border:1px solid currentColor;padding:.28rem .55rem;border-radius:2px;margin-bottom:1.4rem}
.case-hero h1{font-size:clamp(2.6rem,8vw,5.8rem)}
.case-hero .lede{max-width:52ch}
.next{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;text-decoration:none;
  padding:2rem 0;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line)}
.next strong{font-family:var(--display);font-size:clamp(1.5rem,3.5vw,2.4rem);letter-spacing:-.025em;transition:color .15s}
.next:hover strong{color:var(--accent)}

/* ----------------------------------------------------------- regnskab */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line-strong)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem 2.5rem;align-items:start;
  padding:1.7rem 0;border-bottom:1px solid var(--line)}
.row h3{font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:-.015em;margin:0}
.row h3 a{text-decoration:none}
.row h3 a:hover{color:var(--accent)}
.row .what{margin:.35rem 0 0;color:var(--muted);max-width:52ch;font-size:.97rem}
.row .meta{font-family:var(--mono);font-size:.74rem;color:var(--faint);margin:.8rem 0 0;font-variant-numeric:tabular-nums}
.figs{display:grid;grid-template-columns:repeat(3,auto);gap:.4rem 2rem;text-align:right}
.fig{display:flex;flex-direction:column;align-items:flex-end;gap:.15rem}
.fig .k{color:var(--faint);font-size:.64rem}
.fig .v{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.fig.spend .v{color:var(--amber)}
.fig.earn .v{color:var(--accent)}
.pledge{grid-column:1/-1;margin:1rem 0 0;padding:.85rem 1rem;background:var(--soft);font-size:.92rem;color:var(--muted);max-width:70ch}
.pledge strong{color:var(--ink);font-weight:600}
.note{color:var(--muted);font-size:.95rem;max-width:62ch;margin:0 0 .8rem}
.stamp{font-family:var(--mono);font-size:.74rem;color:var(--faint);font-variant-numeric:tabular-nums;margin:1.4rem 0 0}
@media (max-width:720px){
  .row{grid-template-columns:1fr}
  .figs{justify-content:start;text-align:left;margin-top:1rem}
  .fig{align-items:flex-start}
}

/* ---------------------------------------------------------------- cta */
.cta{background:var(--soft);padding:clamp(2.5rem,6vw,4rem) clamp(1.5rem,5vw,3.5rem);
  display:grid;grid-template-columns:minmax(0,1.7fr) auto;gap:1.5rem 3rem;align-items:end;margin:clamp(3rem,7vw,5rem) 0 0}
.cta p{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3.4vw,2.4rem);line-height:1.12;
  letter-spacing:-.025em;margin:0;text-wrap:balance}
@media (max-width:720px){.cta{grid-template-columns:1fr;align-items:start}}

.foot{padding:2rem 0 3rem;display:flex;flex-wrap:wrap;gap:.6rem 1.6rem;color:var(--faint);
  font-family:var(--mono);font-size:.74rem}
.foot a{text-decoration:none}
.foot a:hover{color:var(--accent)}
.foot .sp{margin-right:auto}

/* 1. Knap der skifter indhold ved hover.
      Mekanik fra uiverse.io/JaydipPrajapati1910/quick-stingray-2 (MIT):
      teksten glider op og ud, ikonet glider ind nedefra. */
.btn.swap{position:relative;overflow:hidden}
.btn.swap .t,.btn.swap .i{display:inline-flex;align-items:center;gap:.5rem;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.btn.swap .i{position:absolute;inset:0;justify-content:center;transform:translateY(105%);opacity:0}
.btn.swap .i svg{width:1.15em;height:1.15em}
.btn.swap:hover .t,.btn.swap:focus-visible .t{transform:translateY(-105%);opacity:0}
.btn.swap:hover .i,.btn.swap:focus-visible .i{transform:translateY(0);opacity:1}

/* 2. Ghost-knap der loefter sig og fyldes ved hover.
      Fra uiverse.io/e-coders/new-shrimp-32 (MIT). */
.btn.ghost{transition:color .3s cubic-bezier(.23,1,.32,1),background-color .3s cubic-bezier(.23,1,.32,1),
  box-shadow .3s cubic-bezier(.23,1,.32,1),transform .3s cubic-bezier(.23,1,.32,1)}
.btn.ghost:hover{color:var(--ground);background-color:var(--ink);border-color:var(--ink);
  box-shadow:0 8px 15px color-mix(in srgb,var(--ink) 22%,transparent);transform:translateY(-2px)}
.btn.ghost:active{box-shadow:none;transform:translateY(0)}

/* 3. Tooltip der stiger op med en drejet firkant som pil.
      Fra uiverse.io/mihocsaszilard/nice-dodo-30 (MIT), uden den hoppende animation.
      Virker ogsaa med tastatur (focus) og tryk paa mobil. */
.tip{position:relative;display:inline-flex;align-items:center;gap:.4em;cursor:help;
  text-decoration:underline dotted;text-underline-offset:.3em}
.tip .q{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;
  border:1px solid currentColor;font-size:.85em;line-height:1;text-decoration:none}
.tip .box{--tip-bg:var(--ink);position:absolute;left:0;bottom:calc(100% - .2rem);z-index:4;
  width:max-content;max-width:min(17rem,70vw);padding:.6rem .75rem;border-radius:3px;
  background:var(--tip-bg);color:var(--ground);font-family:var(--body);font-size:.86rem;
  letter-spacing:0;text-transform:none;line-height:1.45;font-weight:400;
  opacity:0;visibility:hidden;pointer-events:none;transition:all .3s}
.tip .box::before{content:"";position:absolute;width:.6em;height:.6em;bottom:-.25em;left:1.1em;
  transform:rotate(45deg);background:var(--tip-bg)}
.tip:hover .box,.tip:focus .box,.tip:focus-within .box{bottom:calc(100% + .7rem);opacity:1;visibility:visible}

@media (prefers-reduced-motion:reduce){
  .btn.swap .t,.btn.swap .i,.btn.ghost,.tip .box{transition:none}
}

/* Tooltip i en regnskabscelle: forankres i cellen, saa den aldrig rager ud over
   skaermkanten (Listepris-cellen i hoejre side gav vandret scroll paa mobil). */
.ledger>div{position:relative}
.ledger .tip{position:static}
.ledger .tip .box{left:1rem;right:1rem;width:auto;max-width:none;bottom:calc(100% - .4rem)}
.ledger .tip:hover .box,.ledger .tip:focus .box,.ledger .tip:focus-within .box{bottom:calc(100% + .5rem)}
body{overflow-x:clip}

/* =====================================================================
   Video-hero i Legora-stil (forsiden). Bevidst altid moerk, uanset tema:
   teksten staar paa video, saa farverne er faste og ikke tema-variabler.
   ===================================================================== */
.vhero{position:relative;min-height:min(100svh,62rem);display:flex;flex-direction:column;
  justify-content:flex-end;overflow:hidden;background:#0B1012;color:#F4F5F3;isolation:isolate}
.vhero video,.vhero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:50% 35%;z-index:-2}
.vhero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(6,10,12,.62) 0%,rgba(6,10,12,0) 22%),
    linear-gradient(0deg,rgba(6,10,12,.92) 0%,rgba(6,10,12,.55) 34%,rgba(6,10,12,0) 68%)}
.vhero .inner{text-align:center;padding:0 clamp(1.25rem,5vw,3rem) clamp(3.5rem,9vh,6rem);
  max-width:64rem;margin:0 auto}
.vhero .eyebrow{color:rgba(244,245,243,.72);margin-bottom:1.3rem}
.vhero h1{font-weight:400;font-size:clamp(2.4rem,6.6vw,5.6rem);line-height:.98;letter-spacing:-.045em;
  color:#F4F5F3;text-wrap:balance}
.vhero h1 .w{display:inline-block;opacity:.34;animation:vh-word 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes vh-word{to{opacity:1}}
.vhero .lede{color:rgba(244,245,243,.8);margin:1.2rem auto 0;max-width:46ch;font-family:var(--display);font-weight:400;letter-spacing:-.005em;font-size:clamp(1rem,1.5vw,1.18rem)}
.vhero .actions{justify-content:center;margin-top:2rem;align-items:center;gap:1.4rem}
.pill{display:inline-flex;align-items:center;gap:.9rem;padding:.4rem .45rem .4rem 1.25rem;border-radius:999px;
  background:#0D5C63;color:#fff;text-decoration:none;font-family:var(--display);font-weight:500;font-size:.98rem;
  transition:background .2s}
.pill .c{display:inline-grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;background:#fff;color:#0D5C63;
  transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.pill .c svg{width:1rem;height:1rem}
.pill:hover{background:#0A474D}
.pill:hover .c{transform:translateX(3px)}
.vlink{color:rgba(244,245,243,.86);font-family:var(--display);font-weight:500;text-decoration:none;
  border-bottom:1px solid rgba(244,245,243,.35);padding-bottom:.1rem}
.vlink:hover{color:#fff;border-color:#fff}
.vhero .corner{position:absolute;bottom:1rem;left:clamp(1.25rem,4vw,2.5rem);right:clamp(1.25rem,4vw,2.5rem);
  display:flex;justify-content:space-between;align-items:center;gap:1rem;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,245,243,.5)}

/* Menu ovenpaa videoen: gennemsigtig, ordmaerke i midten. Bliver til den
   almindelige menu, naar man har scrollet forbi heroen (klassen saettes af JS). */
.nav.over{position:fixed;left:0;right:0;background:transparent;border-bottom-color:transparent;
  backdrop-filter:none;-webkit-backdrop-filter:none;transition:background .3s,border-color .3s}
.nav.over .wrap{display:grid;grid-template-columns:1fr auto 1fr}
.nav.over nav{order:-1}
.nav.over .brand{margin:0;justify-self:center;text-transform:uppercase;letter-spacing:.16em;font-size:1rem}
.nav.over .btn{justify-self:end}
.nav.over:not(.solid) .brand,.nav.over:not(.solid) nav a{color:#F4F5F3}
.nav.over:not(.solid) .brand small{color:rgba(244,245,243,.6)}
.nav.over:not(.solid) nav a{opacity:.85}
.nav.over.solid{background:color-mix(in srgb,var(--ground) 90%,transparent);border-bottom-color:var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media (max-width:720px){.nav.over .wrap{grid-template-columns:1fr auto}.nav.over .brand{justify-self:start}}

@media (prefers-reduced-motion:reduce){
  .vhero h1 .w{animation:none;opacity:1}
  .pill .c{transition:none}
}

/* Tekst i nederste venstre hjoerne i stedet for midten: videoen har en person
   i midten (forfra-skuddet) og til hoejre (skraa-skuddet), saa venstre side er fri.
   Afviger bevidst fra Legoras centrerede layout, der er lavet til en skyline. */
.vhero .inner{text-align:left;width:100%;max-width:1120px;margin:0 auto;
  padding:0 clamp(1.25rem,4vw,2.5rem) clamp(3.8rem,9vh,5.5rem)}
.vhero h1{font-size:clamp(2.3rem,5.6vw,4.7rem);max-width:12.5em}
.vhero h1 .l{display:block}
.vhero .lede{margin-left:0;margin-right:0}
.vhero .actions{justify-content:flex-start}
.vhero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,rgba(6,10,12,.72) 0%,rgba(6,10,12,.35) 38%,rgba(6,10,12,0) 60%)}
@media (max-width:760px){
  .vhero{min-height:86svh}
  .vhero::before{background:linear-gradient(0deg,rgba(6,10,12,.55) 0%,rgba(6,10,12,0) 55%)}
}
/* Paa skaerme smallere end 16:9 beskaerer videoen siderne. Forankr lidt mod venstre,
   saa personen rykker mod hoejre og vaek fra overskriften. Mobil beholder midten. */
@media (min-width:761px){.vhero video,.vhero .poster{object-position:15% 35%}}

/* Resultater: AI-forbrug er en udgift (roed, minus), omsaetning er indtaegt (groen). */
.ledger .cost dd,.fig.cost .v{color:var(--neg)}
.ledger .earn dd,.fig.earn .v{color:var(--pos)}
.case-row .mini b{color:var(--ink)}

/* ---------------------------------------------------- dashboard: diagram */
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.3rem;margin:0 0 1rem;padding:0;list-style:none;
  font-size:.9rem;color:var(--muted)}
.legend i,.chart-tip i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin-right:.45rem;vertical-align:-.05rem}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .g{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--faint);font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums}
.chart .hit{fill:var(--ink);fill-opacity:0;cursor:crosshair}
.chart .hit.on{fill-opacity:.06}
.chart-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ground);padding:.6rem .75rem;
  border-radius:3px;font-size:.82rem;line-height:1.5;white-space:nowrap;opacity:0;transition:opacity .12s;
  z-index:3;transform:translate(-50%,-100%);display:flex;flex-direction:column;min-width:13rem}
.chart-tip.on{opacity:1}
.chart-tip strong{font-family:var(--display);font-weight:700}
.chart-tip .r{display:flex;justify-content:space-between;gap:1.2rem;font-variant-numeric:tabular-nums}
.chart-tip .sum{border-top:1px solid color-mix(in srgb,var(--ground) 30%,transparent);margin-top:.25rem;padding-top:.25rem}
.tabel summary{cursor:pointer;font-family:var(--mono);font-size:.74rem;color:var(--accent);margin-top:1.1rem;
  letter-spacing:.08em;text-transform:uppercase}
.tabel-scroll{overflow-x:auto;margin-top:.8rem}
.tabel table{border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums;width:100%}
.tabel th,.tabel td{padding:.35rem .6rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tabel th{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500}
.tabel th:first-child,.tabel td:first-child{text-align:left}
.row.privat h3{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.chart-tip{transition:none}}
.ledger dd .u{white-space:nowrap}

/* ------------------------------------------------ resultater (hvad AI har givet) */
.wins{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line)}
.win{background:var(--surface);padding:1.4rem 1.4rem 1.3rem;display:flex;flex-direction:column;gap:.15rem;min-width:0}
.win .p{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.55rem}
.win .big{font-family:var(--display);font-weight:700;font-size:clamp(2.1rem,4.4vw,3rem);line-height:1;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.win .unit{font-family:var(--display);font-weight:500;font-size:1rem;color:var(--ink)}
.win p{margin:.6rem 0 0;color:var(--muted);font-size:.95rem;line-height:1.5}

/* /ai: kun grafen */
.chart-page .case-hero{padding-bottom:1.5rem}
.chart-page .case-hero h1{font-size:clamp(2rem,5vw,3.2rem)}
.chart-page{padding-bottom:clamp(3rem,7vw,5rem)}
#resultater{scroll-margin-top:5rem}

/* /ai: byggelog under grafen */
.byggelog{margin-top:clamp(3rem,7vw,4.5rem);border-top:1px solid var(--line-strong);padding-top:1.6rem}
.byggelog-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:.6rem}
.byggelog h2{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3.5vw,2.2rem);letter-spacing:-.025em;margin:0}
.byggelog-head p{margin:0;font-family:var(--mono);font-size:.78rem;color:var(--faint)}
.byggelog-head p strong{font-family:var(--display);font-size:1.5rem;color:var(--accent);letter-spacing:-.02em;margin-right:.2rem}
.byggelog ol{list-style:none;margin:0;padding:0}
.byggelog li{display:grid;grid-template-columns:4.2rem 8.5rem minmax(0,1fr);gap:.2rem 1.4rem;align-items:baseline;
  padding:1rem 0;border-bottom:1px solid var(--line)}
.byggelog time{font-family:var(--mono);font-size:.8rem;color:var(--ink);font-variant-numeric:tabular-nums}
.byggelog .kat{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.byggelog strong{font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.3}
.byggelog li p{margin:.2rem 0 0;color:var(--muted);font-size:.95rem;line-height:1.5}
@media (max-width:620px){
  .byggelog li{grid-template-columns:4.2rem minmax(0,1fr)}
  .byggelog li>div{grid-column:1/-1}
}

/* ---------------------------------------------------------------- blog */
.posts{border-top:1px solid var(--line-strong);margin-bottom:clamp(2rem,5vw,3rem)}
.post-row{display:grid;grid-template-columns:10rem minmax(0,1fr) 1.5rem;gap:.3rem 1.8rem;align-items:baseline;
  padding:1.5rem 0;border-bottom:1px solid var(--line);text-decoration:none}
.post-row time{font-family:var(--mono);font-size:.76rem;color:var(--faint)}
.post-row h2{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,2.6vw,1.75rem);letter-spacing:-.02em;
  line-height:1.15;margin:0;transition:color .15s;text-wrap:balance}
.post-row p{margin:.4rem 0 0;color:var(--muted);font-size:.97rem;max-width:62ch}
.post-row .arr{font-family:var(--display);font-size:1.3rem;color:var(--faint);transition:transform .15s,color .15s}
.post-row:hover h2,.post-row:hover .arr{color:var(--accent)}
.post-row:hover .arr{transform:translateX(4px)}
@media (max-width:620px){.post-row{grid-template-columns:minmax(0,1fr) 1.5rem}.post-row time{grid-column:1/-1}}
.post{max-width:68ch;margin:0 auto;padding:clamp(2rem,6vw,4rem) 0 clamp(1rem,3vw,2rem)}
.post header time{font-family:var(--mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.post h1{font-size:clamp(2.1rem,5.4vw,3.4rem);margin:.8rem 0 2rem}
.post-body{font-size:1.1rem;line-height:1.7}
.post-body p{margin:0 0 1.15rem}
.post-body h2{font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:-.015em;margin:2.4rem 0 .9rem}
.post-body ul{list-style:none;margin:0 0 1.4rem;padding:0;border-top:1px solid var(--line)}
.post-body li{padding:.6rem 0 .6rem 1.4rem;border-bottom:1px solid var(--line);position:relative;font-size:1rem}
.post-body li::before{content:"";position:absolute;left:0;top:1.15em;width:.5rem;height:2px;background:var(--accent)}
.post-body strong{font-weight:600;color:var(--ink)}
.post-body a{color:var(--accent)}

/* Menuen maa ikke knaekke paa smalle skaerme ("Nam / Vu", "Skriv til / mig"). */
.brand,.nav .btn,.nav .btn .t{white-space:nowrap}
@media (max-width:420px){.brand small{display:none}.nav .wrap{gap:.8rem}.nav .btn{padding:.45rem .7rem;font-size:.82rem}}

.services-intro{margin:0 0 1.6rem;font-family:var(--display);font-size:clamp(1.15rem,2vw,1.4rem);line-height:1.35;letter-spacing:-.01em;max-width:34ch;text-wrap:balance}

/* ------------------------------------------- Live AI-forbrug tracker (forside) */
.tracker{padding:clamp(2.5rem,6vw,4rem) 0 clamp(1rem,3vw,2rem)}
.tracker-head{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem 1.5rem;flex-wrap:wrap;margin-bottom:1rem}
.tracker-head h2{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.025em;margin:0}
.tracker-head p{margin:0;font-family:var(--mono);font-size:.74rem;color:var(--faint);font-variant-numeric:tabular-nums}
.tracker .ledger dd{font-size:clamp(2rem,5vw,3.2rem)}
.tracker-sub{font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin:2.2rem 0 1rem}
.posts h3{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,2.4vw,1.6rem);letter-spacing:-.02em;
  line-height:1.15;margin:0;transition:color .15s;text-wrap:balance}
.post-row:hover h3{color:var(--accent)}

.tracker .ledger .tokens dd{font-size:clamp(1.6rem,3.6vw,2.4rem);white-space:nowrap}
.chart-tip .big{font-family:var(--display);font-weight:700;font-size:1.15rem;gap:.4rem;justify-content:flex-start}
.chart-tip .big span:last-child{font-weight:400;font-size:.85rem;align-self:flex-end;opacity:.8}
.chart .hit{cursor:pointer}
.ledger .n a{color:var(--faint);text-decoration:underline;text-underline-offset:.2em}
.ledger .n a:hover{color:var(--accent)}

/* Trackerens tal maa aldrig stikke ud af boksen eller knaekke enheden ned paa ny linje. */
.tracker .ledger{grid-template-columns:repeat(4,minmax(0,1fr))}
.tracker .ledger dd{font-size:clamp(1.5rem,2.6vw,2.3rem);white-space:nowrap;overflow-wrap:normal}
.tracker .ledger .tokens dd{font-size:clamp(1.25rem,2vw,1.8rem)}
@media (max-width:900px){
  .tracker .ledger{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tracker .ledger .tokens{grid-column:1/-1}
  .tracker .ledger dd,.tracker .ledger .tokens dd{font-size:clamp(1.45rem,6vw,2.1rem)}
}

/* ---- Kvalitetsloop runde 1 (14/9) ---- */
/* Kontrast: labels og diagramtekst skal klare AA */
:root{--faint:#6B767A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--faint:#8E9A9D}}
:root[data-theme="dark"]{--faint:#8E9A9D}
.mono,.label,.eyebrow,.tag,.crumbs,dt,.k{font-size:.78rem}
.chart text{font-size:12px;fill:var(--muted)}
/* Ens knapper: afrundede overalt, som pillen i hero */
.btn{border-radius:999px}
/* Saadan starter vi */
.start-trin{list-style:none;counter-reset:trin;margin:0 0 1.4rem;padding:0;display:flex;flex-direction:column;gap:.8rem;max-width:58ch}
.start-trin li{counter-increment:trin;display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.8rem;align-items:baseline;font-size:1.02rem}
.start-trin li::before{content:counter(trin);display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;
  border:1px solid var(--accent);color:var(--accent);font-family:var(--display);font-weight:700;font-size:.95rem}
.start-bevis{margin:0 0 .6rem;padding:.9rem 1.1rem;background:var(--soft);max-width:58ch;font-size:.98rem}
.start-link{font-family:var(--display);font-weight:500;color:var(--accent);text-decoration:none}
.start-link:hover{text-decoration:underline}
/* Kontaktboks: synlig mail og bloed CTA */
.cta-side{display:flex;flex-direction:column;align-items:flex-start;gap:.7rem}
.cta-mail{font-family:var(--mono);font-size:.85rem;color:var(--muted);text-decoration:none}
.cta-mail:hover{color:var(--accent)}
.cta-soft{font-family:var(--display);font-size:.92rem;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-strong)}
.cta-soft:hover{color:var(--ink);border-color:var(--ink)}
/* Mobil-hero: ansigtet fri af teksten, lidt mindre overskrift */
@media (max-width:760px){
  .vhero video,.vhero .poster{object-position:50% 8%}
  .vhero h1{font-size:clamp(2rem,9vw,2.6rem)}
}

/* ---- Kvalitetsloop runde 2 (14/9) ---- */
.til-hvem{margin:0 0 .9rem;color:var(--accent);font-family:var(--display);font-weight:500;font-size:1rem;max-width:52ch}
.om-mig{margin:1.4rem 0 0;color:var(--muted);font-size:.98rem;max-width:52ch}
.start-trin{max-width:52ch}
.start-cta{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;margin:0 0 1.8rem}
.start-cta .note{margin:0;font-size:.92rem}
.start-bevis{display:flex;flex-direction:column;gap:.35rem;border-left:3px solid var(--accent);padding:1rem 1.25rem;background:var(--surface);
  max-width:52ch;margin:0 0 .9rem}
.start-bevis .big{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,3rem);line-height:1;letter-spacing:-.03em;color:var(--accent)}
.cta-mailrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.kopier{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;background:transparent;color:var(--muted);
  border:1px solid var(--line-strong);border-radius:999px;padding:.25rem .65rem;cursor:pointer}
.kopier:hover{color:var(--ink);border-color:var(--ink)}
@media (max-width:760px){
  .vhero{min-height:72svh}
  .vhero::after{background:linear-gradient(180deg,rgba(6,10,12,.55) 0%,rgba(6,10,12,0) 20%),
    linear-gradient(0deg,rgba(6,10,12,.9) 0%,rgba(6,10,12,.45) 45%,rgba(6,10,12,0) 70%)}
}
.cta-note{font-family:var(--display);font-weight:500;font-size:.95rem;color:var(--ink)}

/* ---------------------------------------------------- kontaktvindue (14/9) */
.btn.li{gap:.5rem;padding:.55rem 1rem;font-size:.9rem}
.btn.li svg{width:1rem;height:1rem}
dialog.kontakt{border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);color:var(--ink);
  width:min(34rem,calc(100vw - 2rem));max-height:calc(100svh - 2rem);padding:clamp(1.4rem,4vw,2.2rem);overflow:auto}
dialog.kontakt::backdrop{background:rgba(6,10,12,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
dialog.kontakt h2{font-family:var(--display);font-weight:700;font-size:1.8rem;letter-spacing:-.02em;margin:0 0 .5rem}
.kd-intro{margin:0 0 1.4rem;color:var(--muted)}
.kd-luk{position:absolute;top:.8rem;right:.9rem;background:none;border:0;color:var(--muted);font-size:1.6rem;line-height:1;cursor:pointer;padding:.2rem .5rem}
.kd-luk:hover{color:var(--ink)}
.kf{display:flex;flex-direction:column;gap:.9rem;margin-bottom:1.6rem}
.kf label{display:flex;flex-direction:column;gap:.35rem;font-family:var(--display);font-weight:500;font-size:.92rem}
.kf input,.kf textarea{font:inherit;font-family:var(--body);font-size:1rem;color:var(--ink);background:var(--ground);
  border:1px solid var(--line-strong);border-radius:8px;padding:.65rem .8rem;width:100%}
.kf input:focus,.kf textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.kf textarea{resize:vertical;min-height:6rem}
.kf .btn{align-self:flex-start}
.kf-bot{display:none}
.kf-samtykke{margin:0;font-size:.82rem;color:var(--faint)}
.kf-status{margin:0;font-family:var(--display);font-weight:500}
.kf-status.ok{color:var(--pos)}
.kf-status.fejl{color:var(--neg)}
.kd-direkte{display:flex;flex-direction:column;align-items:flex-start;gap:.7rem;border-top:1px solid var(--line);padding-top:1.2rem}
/* ------------------------------------------------------ portraet i footer */
.footer-person{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:1.5rem 2rem;align-items:center;
  margin:clamp(3rem,7vw,5rem) 0 0;padding-top:clamp(2rem,5vw,3rem);border-top:1px solid var(--line)}
.footer-person figure{margin:0}
.footer-person img{width:100%;height:auto;border-radius:10px;display:block}
.footer-person figcaption{margin-top:.5rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.fp-navn{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:-.02em;margin:0}
.fp-rolle{margin:.2rem 0 1rem;color:var(--muted)}
.fp-links{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.2rem}
@media (max-width:620px){.footer-person{grid-template-columns:1fr}.footer-person figure{max-width:18rem}}

/* ------------------------------------------------------------ /kontakt/ (14/9) */
.kontaktside{padding-block:clamp(2.5rem,6vw,4.5rem) clamp(1rem,3vw,2rem)}
.ks-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(2rem,5vw,4.5rem);align-items:start}
.ks-foto{margin:0 0 1.6rem}
.ks-foto img{width:100%;height:auto;border-radius:14px;display:block}
.ks-foto figcaption{margin-top:.5rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ks-info{margin:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ks-info>div{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}
.ks-info dd{margin:0;font-family:var(--display);font-weight:500}
.ks-hoejre h1{font-size:clamp(2.4rem,6vw,4rem);margin:1rem 0 .8rem}
.ks-hoejre .tag{display:inline-block;color:var(--accent);border:1px solid currentColor;padding:.28rem .55rem;border-radius:2px}
.ks-hoejre .lede{margin:0 0 1.8rem;max-width:44ch}
.ks-trin{margin-top:2.4rem;padding-top:1.6rem;border-top:1px solid var(--line)}
.ks-trin .label{margin:0 0 1rem}
@media (max-width:860px){.ks-grid{grid-template-columns:1fr}.ks-hoejre{order:-1}}
.ks-baggrund{margin:28px 0 8px}
.ks-baggrund h2{font:500 12px/1 var(--mono,ui-monospace,monospace);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.ks-baggrund p{margin:0;line-height:1.65;font-size:16px;color:var(--ink,inherit)}
.post-fig{margin:2rem 0}
.post-fig img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
.post-fig figcaption{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:.5rem}

document.querySelectorAll('.kopier').forEach(function (k) {
  k.addEventListener('click', function () {
    var ok = function () { k.textContent = 'Kopieret'; setTimeout(function () { k.textContent = 'Kopiér mail'; }, 2000); };
    if (navigator.clipboard) { navigator.clipboard.writeText(k.getAttribute('data-mail')).then(ok, ok); } else { ok(); }
  });
});
</script>
<script>
(function () {
  var form = document.querySelector('form.kf'); if (!form) return;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var st = form.querySelector('.kf-status');
    if (!form.checkValidity()) { form.reportValidity(); return; }
    var data = {}; new FormData(form).forEach(function (v, k) { data[k] = v; });
    var knap = form.querySelector('button[type=submit]'); knap.disabled = true;
    fetch(form.getAttribute('data-endpoint'), { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.success) { form.reset(); st.textContent = st.getAttribute('data-tak'); st.className = 'kf-status ok'; } else { throw new Error(); } })
      .catch(function () { st.textContent = st.getAttribute('data-fejl'); st.className = 'kf-status fejl'; })
      .then(function () { knap.disabled = false; });
  });
})();
</script>
